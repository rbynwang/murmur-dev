[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "murmur"
version = "0.1.0"
description = "Agents for an evening peak cut: code decides every amount, a small model only reads notes and words reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
experiments = ["pandas>=2.1", "pyarrow>=14"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["murmur*"]

[tool.setuptools.package-data]
"murmur.node" = ["*.json", "*.npz"]
"murmur.node.buildings" = ["*.json", "*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = ["engie_data: needs ENGIE's dataset at MURMUR_ENGIE_DATA_DIR"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]   # the test client's own notice, not this code's
