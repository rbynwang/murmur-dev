<!-- @terminal -->
<figure class="term {{cls}}" id="T-{{id}}"><figcaption><b>{{name}}</b><span>{{what}}</span><em></em></figcaption><ol class="tb {{size}}" tabindex="0" aria-label="{{label}} terminal">{{body}}</ol></figure>
<!-- @bubble -->
<div class="bub fut{{me}}" data-s="{{step}}"><small>{{time}} · {{title}}</small>{{text}}</div>
<!-- @head -->
<div class="lh"><span class="lnum" aria-hidden="true">{{number}}</span><div><h2>{{title}}</h2><p class="ov">{{overview}}</p>{{chips}}</div></div>
<!-- @gaps -->
<div class="sub"><h4 class="subt small">What this layer doesn't do</h4><ul class="gapl">{{items}}</ul></div>
<!-- @gap -->
<li><b>{{title}}.</b> {{actual}}</li>
<!-- @revs -->
<div class="revs">{{rows}}</div>
<!-- @rev -->
<div class="sub"><h4 class="subt small"><span class="chg">{{title}}</span><span class="rev">{{tag}}</span></h4><p class="why"><b>Was:</b> {{was}} <b>Now:</b> {{now}}</p></div>
<!-- @small -->
{{value}} <small>{{unit}}</small>
